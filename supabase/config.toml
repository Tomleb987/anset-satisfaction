# Config CLI Supabase — projet ANSET « Satisfaction » (region eu-west-1, UE).
# `supabase link --project-ref xizitftoejfxaizztzeu` avant `db push` / `functions deploy`.
project_id = "xizitftoejfxaizztzeu"

# Formulaire public → endpoint sans JWT (le client n'est pas authentifié).
[functions.submit-sondage]
verify_jwt = false

# Envoi Brevo → déclenché par un manager connecté (ou service key) : JWT requis.
# Attention : verify_jwt accepte aussi la clé publishable (publique) — les deux
# fonctions ci-dessous revérifient donc l'appelant elles-mêmes.
[functions.envoi-sondage]
verify_jwt = true

# Gestion des comptes → réservée au super admin (contrôle dans la fonction).
[functions.admin-utilisateurs]
verify_jwt = true

# Mot de passe oublié → public par nécessité : qui a perdu son mot de passe ne peut
# pas s'authentifier pour demander à le changer. Le durcissement est dans la
# fonction (réponse neutre, jeton haché à usage unique, débit limité par compte).
[functions.mot-de-passe-oublie]
verify_jwt = false
