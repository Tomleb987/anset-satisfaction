# Config CLI Supabase — projet ANSET « Satisfaction » (region eu-west-3, UE).
# `supabase link --project-ref ldjoclcbvydtbsltqvin` avant `db push` / `functions deploy`.
project_id = "ldjoclcbvydtbsltqvin"

# Formulaire public → endpoint sans JWT (le client n'est pas authentifié).
[functions.submit-sondage]
verify_jwt = false

# Envoi Brevo → déclenché par un manager connecté (ou service key) : JWT requis.
[functions.envoi-sondage]
verify_jwt = true
